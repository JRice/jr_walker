[loop]
max_runs = 1

[limits]
# Hard stop on produced plan length. If exceeded before finishing all orders,
# the run exits and writes partial output. For a full run, you want this to be 16000 or so.
# A good test size for 100 deliveries is around 2000
max_makespan = 16000
# Seconds of compute budget:
# An every_n_orders=10 run takes 300-400s.
# A every_n_orders=1 run on 4/12 took 4100s
# so you want this high:
max_plan_time = 13000
# Solve every Nth order from the worklist (1 = all orders). THIS SHOULD BE 1 for a full run.
# A good test size is 10, to try 100 deliveries.
every_n_orders = 1

[paths]
output_dir = "output"
log_path = "output/run.log"
metadata_db_path = "output/solution_metadata.db"
input_path = "docs/BIG_ORDER.txt"
# output_path = "output/explicit_solution.txt"

[solver]
# Reservation horizon (space-time planner tensor depth).
max_time = 50000
# Number of highest-lift SKU relocation candidates to build.
relocation_top_skus = 16
# Max relocation suggestions admitted into the dispatch queue.
num_allowed_relocations = 18
# Scales DockSuggestion expected gain (higher => more likely to do strategic docking).
dock_gain_scale = 8.0
# Scales normalized relocation gain after order-relative normalization.
relocation_gain_scale = 3.0
# If true, disallow two robots swapping positions in one timestep.
strict_no_swap = false
# Run full validator replay every N makespan ticks during dispatch.
# Set to 0 to disable periodic validation.
ticks_to_full_validation = 500
# Log/print A* calls slower than this many milliseconds.
astar_slow_ms = 40
# If true, also print slow A* lines to STDOUT (always written to run.log).
astar_print_slow = false
# If true, log blocked A* attempts even when they are not slow.
astar_log_blocked = false
# Keep relocation code available, but disabled for now.
enable_relocation_suggestions = false
# Max retries for a suggestion before dropping it from the queue.
suggestion_retry_limit = 12
# Queue-cycle exponential backoff base and cap for failed suggestions.
suggestion_backoff_base_cycles = 2
suggestion_backoff_max_cycles = 128
# Hard fail if setup is complete and no additional orders are completed for this many dispatch cycles.
order_stagnation_cycle_limit = 256
# If true, livelocked robots retire to nearest corner instead of immediate fail-fast.
realistic_fail_mode = false
# Try up to this many robots for a suggestion before requeue/backoff.
max_robots_per_suggestion = 3
# Local mini-box radius used by hierarchical motion maneuvers (2 => 5x5 box).
setup_mini_box_radius = 2
# After this many consecutive local planning failures, try parking that robot.
robot_fail_streak_for_parking = 3
# Max low-use parking targets scanned per parking attempt.
parking_candidate_limit = 96

[lns]
enabled = true
iterations = 60
window_actions = 28
tail_fraction = 0.35
max_shift = 2

[relocation]
lane_width = 3
# Only scan metadata heatmap cells within this edge distance (cells).
edge_band_for_heatmap = 6
# Group SKU-flow metadata into N x N chunks before selecting anchor cells.
# Set to 1 to disable chunking (original exact-cell behavior).
relocate_chunk_size = 5
# Setup hotspots used by SetupSuggestion initialization phase.
setup_hotspots = [[0, 15], [15, 0], [35,0], [15, 39], [35,39]]
# Optional explicit relocation SKU order. If provided, only these SKUs are
# used for startup relocation planning (in listed order).
# skus_to_relocate = [1, 2, 3, 4, 5]
